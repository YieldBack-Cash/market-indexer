# Two jobs. `app` is what a developer runs before pushing: Prisma client,
# typecheck, tests. `contract-checks` proves the copies this service keeps of
# contract knowledge are current: the event layouts generated from the
# contract binaries and the vendored protocol file. Those need the contracts
# repo built beside this one, so that job checks it out and builds it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  STELLAR_CLI: "25.2.0"

jobs:
  app:
    name: typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx vitest run

  contract-checks:
    name: generated layouts and protocol copy are current
    runs-on: ubuntu-latest
    steps:
      - name: Check out market-indexer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: market-indexer

      - name: Check out ybc-contracts beside it
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: YieldBack-Cash/ybc-contracts
          path: ybc-contracts

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-30
        with:
          toolchain: "1.91.1"
          targets: wasm32v1-none

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ybc-contracts

      # The CLI is installed the way the Stellar docs prescribe. crates.io
      # versions are immutable and Cargo checks every crate against the
      # registry's checksums, which the release tarball this replaced never
      # was. Compiling it takes minutes, so the binary is cached per version
      # and the install is skipped when the cache already holds it.
      - name: Cache Stellar CLI ${{ env.STELLAR_CLI }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/stellar
          key: stellar-cli-${{ env.STELLAR_CLI }}-${{ runner.os }}

      - name: Install Stellar CLI ${{ env.STELLAR_CLI }}
        run: |
          if ! stellar --version 2>/dev/null | grep -q "^stellar ${STELLAR_CLI} "; then
            # The CLI's keyring and Ledger support link against D-Bus and udev.
            sudo apt-get update -qq
            sudo apt-get install -y -qq libdbus-1-dev libudev-dev pkg-config
            cargo install --locked stellar-cli@"${STELLAR_CLI}"
          fi
          stellar --version

      - name: Build contracts
        working-directory: ybc-contracts
        run: stellar contract build

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: market-indexer/package-lock.json
      - run: npm ci
        working-directory: market-indexer
      - run: npx prisma generate
        working-directory: market-indexer

      - name: Event layouts match the contract binaries
        working-directory: market-indexer
        run: npm run check:events

      - name: Protocol file matches the master
        working-directory: market-indexer
        run: npm run check:protocol
